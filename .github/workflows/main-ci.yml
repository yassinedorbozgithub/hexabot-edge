name: Main CI
permissions:
  contents: read

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Run typecheck/lint/test/build for all packages
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hexabot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hexabot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: 🔎 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⏳ Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1
          standalone: true
          run_install: false

      - name: ⏳ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.17.0"
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧬 Check lockfile is deduplicated
        run: pnpm dedupe --check

      - name: ♻️ Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: 🔎 Verify API SQLite driver
        run: pnpm --filter @hexabot-ai/api exec node -e "require('better-sqlite3'); require('typeorm/platform/PlatformTools').PlatformTools.load('better-sqlite3')"

      - name: 🧪 Typecheck, lint, format, test and build (affected packages via Turbo)
        run: pnpm exec turbo run typecheck lint format:check test build --affected --concurrency=80%
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}

      - name: 🛠️ Build API dependencies for integration tests
        run: pnpm exec turbo run build --filter=@hexabot-ai/api^... --concurrency=80%

      - name: 🐘 Core migration PostgreSQL integration tests
        run: pnpm --filter @hexabot-ai/api exec jest --runInBand --runTestsByPath src/migration/migrations/1784815200000-v-3-4-0.integration.spec.ts
        env:
          DB_TYPE: postgres
          TEST_POSTGRES_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hexabot_test
