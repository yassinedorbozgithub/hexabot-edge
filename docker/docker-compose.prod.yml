version: "3.8"

services:
  api:
    pull_policy: never
    build:
      context: ../
      dockerfile: ./packages/api/Dockerfile
      args:
        DB_TYPE: ${DB_TYPE:-sqlite}
      target: production

  hexabot-frontend:
    pull_policy: never
    build:
      context: ../
      dockerfile: ./packages/frontend/Dockerfile
      target: production
