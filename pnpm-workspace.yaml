packages:
  - "packages/agentic"
  - "packages/api"
  - "packages/types"
  - "packages/frontend"
  - "packages/graph"
  - "packages/cli"
  - "packages/eslint-config"
  - "packages/tsconfig"
  - "packages/widget"

nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false
ignoreWorkspaceRootCheck: true

allowBuilds:
  "@compodoc/compodoc": true
  "@nestjs/core": true
  "@parcel/watcher": true
  "@scarf/scarf": true
  "@swc/core": true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  tree-sitter: true
  unrs-resolver: true

overrides:
  "@ai-sdk/provider-utils": "^4.0.33"
  "@opentelemetry/core": "2.10.0"
  "ajv@8": "8.20.0"
  "dompurify": "3.4.16"
  "glob": "13.0.6"
  "ip-address": "10.7.2"
  "js-yaml": "4.3.2"
  "minimatch": "10.2.5"
  "nestjs-auditlog>@opentelemetry/auto-instrumentations-node": "0.79.0"
  "nestjs-auditlog>@opentelemetry/sdk-node": "0.221.0"
  "picomatch": "4.0.4"
  # Keep a single React copy across the workspace (hoisted linker + externalized
  # react in the widget build both break if a transitive dep pulls its own copy).
  "react": "19.2.7"
  "react-dom": "19.2.7"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.4"
  "shell-quote": ">=1.11.0"
  "uuid": "11.1.1"
  "ws": "8.21.0"
  "multer": "2.4.0"
  "undici": "7.29.1"
