packages:
  - "packages/agentic"
  - "packages/api"
  - "packages/api/src/extensions/*/*"
  - "packages/types"
  - "packages/frontend"
  - "packages/graph"
  - "packages/cli"
  - "packages/eslint-config"
  - "packages/tsconfig"
  - "packages/widget"

nodeLinker: hoisted
# Script execution must not reinstall extensions excluded by install:db.
verifyDepsBeforeRun: false
autoInstallPeers: true
strictPeerDependencies: false
ignoreWorkspaceRootCheck: true

allowBuilds:
  "@compodoc/compodoc": true
  "@nestjs/core": true
  "@parcel/watcher": true
  "@scarf/scarf": true
  "@swc/core": true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  tree-sitter: true
  unrs-resolver: true

overrides:
  "@ai-sdk/provider-utils": "^4.0.33"
  "@opentelemetry/core": "2.10.0"
  "ajv@8": "8.20.0"
  "dompurify": "3.4.17"
  "glob": "14.0.2"
  "ip-address": "10.7.4"
  "js-yaml": "4.3.2"
  "minimatch": "11.0.1"
  "nestjs-auditlog>@opentelemetry/auto-instrumentations-node": "0.79.0"
  "nestjs-auditlog>@opentelemetry/sdk-node": "0.221.0"
  "picomatch": "4.0.4"
  # Keep a single React copy across the workspace (hoisted linker + externalized
  # react in the widget build both break if a transitive dep pulls its own copy).
  "react": "19.2.7"
  "react-dom": "19.2.7"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.4"
  "shell-quote": ">=1.11.0"
  "uuid": "11.1.1"
  "ws": "8.21.0"
  "multer": "2.5.0"
  "undici": "7.30.1"
  "body-parser": "2.4.0"
  "fast-uri": "3.1.9"
  "follow-redirects": "1.16.2"
  "handlebars": "4.7.10"
  "hono": "4.13.16"
  "@hono/node-server": "2.1.6"
  "@opentelemetry/instrumentation-http": "0.222.0"
  "qs": "6.16.1"
  "systeminformation": "5.33.16"
